<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virat Kohli | JNV Varanasi Magazine</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8f7f5;
            --text-main: #1a1a1a;
            --text-muted: #555555;
            --header-bg: #0f172a;
            --accent-color: #c2a67f;
            --card-bg: #ffffff;
            --border-light: rgba(0,0,0,0.08);
            --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, blockquote { font-family: 'Playfair Display', serif; }

        /* Nav */
        .profile-nav {
            display: flex; justify-content: space-between; padding: 20px 40px;
            border-bottom: 1px solid var(--border-light); font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .back-link { color: var(--text-muted); text-decoration: none; transition: color 0.2s;}
        .back-link:hover { color: var(--accent-color); }
        .magazine-brand { color: var(--header-bg); font-weight: 600; }

        /* Main Container */
        main { max-width: 1100px; margin: 0 auto; padding: 60px 20px; }

        /* 1. Hero Section */
        .hero-section {
            display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px;
            align-items: center; margin-bottom: 80px;
        }
        .hero-image-wrapper {
            position: relative; border-radius: 20px 20px 0 20px;
            overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        #profile-img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 3/4; display: block; }
        
        .hero-meta {
            font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px;
            color: var(--accent-color); font-weight: 600; margin-bottom: 20px;
        }
        .hero-content h1 {
            font-size: clamp(3.5rem, 8vw, 5.5rem); line-height: 1;
            letter-spacing: -2px; color: var(--header-bg); margin-bottom: 30px;
        }

        /* 2. About & Stats */
        .about-section {
            display: grid; grid-template-columns: 2fr 1fr; gap: 60px;
            margin-bottom: 80px; padding-top: 60px; border-top: 1px solid var(--border-light);
        }
        .bio-block h2, .favourites-section h2 { font-size: 2.5rem; color: var(--header-bg); margin-bottom: 20px; }
        .bio-block p { font-size: 1.15rem; color: var(--text-muted); white-space: pre-line; }
        
        .quick-stats-block { background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-light); }
        .stat-item { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-light); }
        .stat-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px;}
        .stat-value { font-size: 1.1rem; font-weight: 500; color: var(--header-bg); }

        /* 3. Tags (Chips) */
        .tags-section { display: flex; flex-wrap: wrap; gap: 40px; margin-bottom: 80px; }
        .tag-group h3 { font-size: 1.5rem; margin-bottom: 15px; }
        .chip-container { display: flex; flex-wrap: wrap; gap: 10px; }
        .chip {
            background: var(--header-bg); color: white; padding: 8px 16px;
            border-radius: 30px; font-size: 0.9rem; transition: var(--transition);
        }
        .chip:hover { transform: translateY(-3px); background: var(--accent-color); }

        /* 4. Favourites Grid */
        .favourites-section { margin-bottom: 80px; }
        .fav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .fav-card {
            background: var(--card-bg); padding: 30px; border-radius: 12px;
            border: 1px solid var(--border-light); transition: var(--transition);
        }
        .fav-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .fav-label { font-size: 0.75rem; text-transform: uppercase; color: var(--accent-color); font-weight: 600; letter-spacing: 1px;}
        .fav-card h4 { font-size: 1.5rem; margin: 10px 0 5px; color: var(--header-bg); }

        /* 5. Quote Section */
        .quote-section { margin: 80px 0; text-align: center; padding: 0 20px; }
        #profile-quote { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.3; color: var(--header-bg); font-style: italic; max-width: 900px; margin: 0 auto; }
        #profile-quote::before, #profile-quote::after { content: '"'; color: var(--accent-color); }

        /* 6. CTA Button Section */
        .cta-section { text-align: center; margin: 60px 0 80px; }
        .cta-button {
            display: inline-block;
            background-color: var(--header-bg);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 18px 45px;
            border-radius: 50px;
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
        }
        .cta-button:hover {
            background-color: var(--accent-color);
            color: white;
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(194, 166, 127, 0.3);
        }

        /* Footer */
        .social-section { text-align: center; padding: 60px 20px; border-top: 1px solid var(--border-light); }
        .social-section p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;}
        #profile-ig-link { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--header-bg); text-decoration: none; transition: color 0.3s; }
        #profile-ig-link:hover { color: var(--accent-color); }

        @media (max-width: 900px) {
            .hero-section { grid-template-columns: 1fr; gap: self; gap: 40px; }
            .hero-image-wrapper { aspect-ratio: 1/1; max-width: 400px; margin: 0 auto; border-radius: 20px; }
            .hero-content { text-align: center; }
            .about-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="profile-nav">
        <a href="#" class="back-link">← Directory</a>
        <span class="magazine-brand">JNV Varanasi</span>
    </nav>

    <main id="profile-container">
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="hero-image-wrapper">
                <img id="profile-img" src="https://play-lh.googleusercontent.com/632GyYNKJHBQ0Zw2Lk3ZR95JfnyVt_wL9vXXQmgGaYMDiGxGmUNs3GEkpdy2ka9VJ8F6Bo39Q5P-Pj8H4KTs=w240-h480-rw" alt="Virat Kohli Portrait">
            </div>
            <div class="hero-content">
                <p class="hero-meta" id="profile-meta-top"></p>
                <h1 id="profile-name"></h1>
            </div>
        </section>

        <!-- About & Quick Stats -->
        <section class="about-section">
            <div class="bio-block">
                <h2>About Me</h2>
                <p id="profile-bio"></p>
            </div>
            <div class="quick-stats-block" id="quick-stats">
                <!-- Javascript will inject stats here -->
            </div>
        </section>

        <!-- Tags: Hobbies & Interests -->
        <section class="tags-section" id="section-tags">
            <div class="tag-group" id="group-hobbies">
                <h3>Hobbies</h3>
                <div class="chip-container" id="chips-hobbies"></div>
            </div>
            <div class="tag-group" id="group-interests">
                <h3>Interests</h3>
                <div class="chip-container" id="chips-interests"></div>
            </div>
        </section>

        <!-- Favourites Grid -->
        <section class="favourites-section" id="section-favourites">
            <h2>My Favourites</h2>
            <div class="fav-grid">
                <div class="fav-card" id="fav-subject">
                    <span class="fav-label">Subject</span>
                    <h4 id="val-subject"></h4>
                </div>
                <div class="fav-card" id="fav-book">
                    <span class="fav-label">Book</span>
                    <h4 id="val-book"></h4>
                </div>
                <div class="fav-card" id="fav-movie">
                    <span class="fav-label">Movie</span>
                    <h4 id="val-movie"></h4>
                </div>
            </div>
        </section>

        <!-- Signature Quote -->
        <section class="quote-section" id="section-quote">
            <blockquote id="profile-quote"></blockquote>
        </section>

        <!-- Add Your Data CTA -->
        <section class="cta-section">
            <a href="https://atulya-pratap.github.io/submit/" class="cta-button" target="_blank" rel="noopener noreferrer">
                Add Your Data
            </a>
        </section>

        <!-- Instagram -->
        <section class="social-section" id="section-instagram">
            <p>Find me online</p>
            <a href="#" id="profile-ig-link" target="_blank">@<span id="profile-ig-handle"></span></a>
        </section>
    </main>

    <script>
        // 1. Virat Kohli Sample Data
        const studentData = {
            name: "Virat Kohli",
            class: "12",
            section: "Maths",
            rollNumber: "18",
            house: "Shivalik",
            bio: "Cricket isn't just a game; it's a way of life that teaches discipline, resilience, and passion. \n\nOn and off the pitch, I believe in pushing boundaries, setting new standards, and inspiring the next generation to chase greatness with unwavering focus.",
            hobbies: ["Cricket", "Fitness Training", "Traveling", "Badminton"],
            interests: ["Sports Science", "Nutrition", "Leadership", "Philanthropy"],
            favouriteSubject: "Physical Education",
            favouriteBook: "The Autobiography of Yogi",
            favouriteMovie: "Rocky",
            favouriteQuote: "⚠️ Ye sirf sample profile hai. Apna data submit kar do, warna profile mein random info daalni padegi 😭",
            instagram: "virat.kohli",
        };

        // 2. THIS INJECTS THE DATA INTO THE HTML
        document.addEventListener("DOMContentLoaded", () => {
            
            // Hero
            document.getElementById('profile-name').textContent = studentData.name;
            document.getElementById('profile-meta-top').textContent = `Class ${studentData.class} • Section ${studentData.section} • Roll ${studentData.rollNumber} • ${studentData.house} House`;
            
            // Bio
            document.getElementById('profile-bio').textContent = studentData.bio;

            // Stats Block
            const statsContainer = document.getElementById('quick-stats');
            const stats = [
                { label: "Class", value: `${studentData.class} ${studentData.section}` },
                { label: "Roll No.", value: studentData.rollNumber },
                { label: "House", value: studentData.house }
            ];
            stats.forEach(stat => {
                statsContainer.innerHTML += `<div class="stat-item"><div class="stat-label">${stat.label}</div><div class="stat-value">${stat.value}</div></div>`;
            });

            // Tags
            const buildChips = (id, arr) => {
                const container = document.getElementById(id);
                arr.forEach(item => container.innerHTML += `<span class="chip">${item}</span>`);
            };
            buildChips('chips-hobbies', studentData.hobbies);
            buildChips('chips-interests', studentData.interests);

            // Favourites
            document.getElementById('val-subject').textContent = studentData.favouriteSubject;
            document.getElementById('val-book').textContent = studentData.favouriteBook;
            document.getElementById('val-movie').textContent = studentData.favouriteMovie;

            // Quote & Instagram
            document.getElementById('profile-quote').textContent = studentData.favouriteQuote;
            document.getElementById('profile-ig-handle').textContent = studentData.instagram;
            document.getElementById('profile-ig-link').href = `https://instagram.com/${studentData.instagram}`;
        });
    </script>
</body>
</html>
